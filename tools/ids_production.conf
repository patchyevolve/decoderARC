# IDS Production Daemon Configuration
# Place at /etc/ids/ids.conf  or pass via --config

state_dir         = /var/lib/ids
alert_threshold   = 0.70
block_threshold   = 0.92
shards            = 0
verbose           = true
prometheus        = true
prometheus_port   = 9102

# Cloud connection (get these from the CoreIDS dashboard → Devices → Add Sensor)
cloud_url         = http://your-server.com:8000
device_id         = <paste-device-id-here>
api_key           = <paste-api-key-here>

# Forwarder-only mode: disables local IDS inference, only forwards raw traffic events
forwarder_only    = true
